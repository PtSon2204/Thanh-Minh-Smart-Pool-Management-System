name: smartpool-tests

services:
  postgres:
    image: postgres:16
    container_name: smartpool-test-postgres
    environment:
      POSTGRES_DB: smartpool_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartpool-test-only
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartpool_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: smartpool-test-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
