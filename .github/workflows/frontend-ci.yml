name: Frontend CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/thanh-minh-smart-pool

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: ./frontend/thanh-minh-smart-pool/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint (Optional)
      run: npm run lint
      
    - name: Build
      run: npm run build
