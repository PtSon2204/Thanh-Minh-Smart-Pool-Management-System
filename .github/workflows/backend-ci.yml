name: Backend CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartpool_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartpool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=smartpool_test;Username=postgres;Password=postgres
      SMARTPOOL_TEST_BOOTSTRAP: "true"
      SMARTPOOL_TEST_REDIS_CONNECTION: localhost:56379,abortConnect=true,connectTimeout=5000
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartPoolManagementSystem.sln

      - name: Build
        run: dotnet build SmartPoolManagementSystem.sln --no-restore

      - name: Install FFmpeg (cached)
        uses: federicocarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: release

      - name: Test
        env:
          SMARTPOOL_CAMERA_TEST_FFMPEG: ${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}
        run: dotnet test SmartPoolManagementSystem.sln --no-build --verbosity normal --blame-hang-timeout 90s --blame-hang-dump-type none -- RunConfiguration.MaxCpuCount=1
